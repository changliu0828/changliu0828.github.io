<link rel="stylesheet" href="/assets/css/boids.css">
<section class="canvas-container">
  <canvas id="demo-canvas" resize></canvas>
  <section class="control">
    <div class="control-label-value">
      <span class="control-label">Count:</span>
      <div class="control-input-group">
        <input type="range" id="boids-count" class="control-input" min="1" max="100" value="1">
        <span class="control-value" id="number-value">1</span>
      </div>
    </div>
    <div class="control-label-value">
      <span class="control-label">Perception:</span>
      <div class="control-input-group">
        <input type="range" id="perception" class="control-input" min="0" max="100" step="10" value="0">
        <span class="control-value" id="perception-value">0</span>
      </div>
    </div>
    <div class="control-label-value">
      <span class="control-label">Separation:</span>
      <div class="control-input-group">
        <input type="range" id="separation" class="control-input" min="0" max="5" step="1" value="0">
        <span class="control-value" id="separation-value">0</span>
      </div>
    </div>
    <div class="control-label-value">
      <span class="control-label">Cohesion:</span>
      <div class="control-input-group">
        <input type="range" id="cohesion" class="control-input" min="0" max="5" step="1" value="0">
        <span class="control-value" id="cohesion-value">0</span>
      </div>
    </div>
    <div class="control-label-value">
      <span class="control-label">Alignment:</span>
      <div class="control-input-group">
        <input type="range" id="alignment" class="control-input" min="0" max="5" step="1" value="0">
        <span class="control-value" id="alignment-value">0</span>
      </div>
    </div>
    <div class="control-label-value">
      <span class="control-label">Highlight:</span>
      <div class="control-input-group">
        <input type="checkbox" id="highlight" class="control-input checkbox">
        <span class="control-value"></span>
      </div>
    </div>
  </section>
  <section class="play">
      <button class="play-button">Play</button>
  </section>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
<script type="text/paperscript" src="/assets/scripts/boids.js" canvas="demo-canvas"></script>
